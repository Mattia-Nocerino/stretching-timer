<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13875F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stretching">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Timer Stretching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen app, figure on top, big countdown ring, controls at the thumb. Phase colour drives everything. */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --fg:#16201B; --muted:#5D6A64; --line:#D5DDD8;
  --work:#13875F; --rest:#4F5FD8; --prep:#C7811B;
  --figure:#16201B;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --mono:"DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --phase:var(--work);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#17201C; --fg:#E7EEEA; --muted:#93A39B; --line:#2A3631;
  --work:#3CCB93; --rest:#8A97FF; --prep:#F0AE45; --figure:#E7EEEA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#17201C; --fg:#E7EEEA; --muted:#93A39B; --line:#2A3631;
  --work:#3CCB93; --rest:#8A97FF; --prep:#F0AE45; --figure:#E7EEEA; color-scheme:dark}

[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}
body{margin:0;font-size:14px}
img{max-width:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
body[data-phase="rest"]{--phase:var(--rest)}
body[data-phase="prep"]{--phase:var(--prep)}
.app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-block:16px 20px;gap:16px}
.view{display:flex;flex-direction:column;gap:16px;flex:1}
h1{font-size:2.1rem;font-weight:800;letter-spacing:-.02em;line-height:1;margin:8px 0 0;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:.95rem;line-height:1.45}
.label{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* start list */
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.plan li{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.plan li:first-child{border-top:0}
.plan svg{width:56px;height:40px}
.plan .n{font-weight:700;font-size:1rem}
.plan .m{color:var(--muted);font-size:.8rem}
.plan .t{font-family:var(--mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

button{font:inherit;cursor:pointer;border:0;border-radius:999px}
button:focus-visible{outline:3px solid var(--phase);outline-offset:3px}
.primary{background:var(--phase);color:var(--bg);font-weight:800;font-size:1.25rem;padding:18px;width:100%;letter-spacing:.01em}
.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line);padding:12px 18px;font-weight:600}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface);border:1.5px solid var(--line);color:var(--fg);padding:8px 14px;font-size:.88rem;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--phase);color:var(--phase)}

/* run view */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--phase);transition:width .3s linear}
.phase{font-family:var(--mono);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--phase);font-weight:500}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.stage svg.fig{width:100%;max-width:300px;height:auto;aspect-ratio:200/140}
.side{position:absolute;top:12px;right:12px;font-family:var(--mono);font-size:.75rem;background:var(--phase);color:var(--bg);padding:4px 9px;border-radius:999px}
.ex-name{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;line-height:1.05;text-align:center;margin:4px 0 0;text-wrap:balance}
.ex-muscle{color:var(--muted);font-size:.9rem;text-align:center}
.clock{position:relative;width:min(62vw,230px);aspect-ratio:1;margin:0 auto;max-width:100%}
.clock svg{width:100%;height:100%;transform:rotate(-90deg)}
.clock .trk{stroke:var(--line)}
.clock .prg{stroke:var(--phase);transition:stroke-dashoffset .25s linear}
.clock .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:clamp(3.4rem,17vw,4.6rem);font-variant-numeric:tabular-nums;color:var(--fg);letter-spacing:-.04em}
.controls{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px;margin-top:auto}
.controls .primary{font-size:1.05rem;padding:15px}
.pulse .num{animation:pulse .5s ease-out}
@keyframes pulse{from{transform:scale(1.12);color:var(--phase)}to{transform:scale(1)}}

/* figures */
.fig .ln{stroke:var(--figure);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .hd{fill:var(--figure)}
.fig .gd{stroke:var(--line);stroke-width:3;stroke-linecap:round}
.fig .zone{fill:var(--phase);opacity:.28}
.plan .fig .ln{stroke-width:8}
.plan .fig .zone{fill:var(--work)}

.done{align-items:center;text-align:center;justify-content:center}
.done .big{font-size:4.2rem;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--work)}
@media (prefers-reduced-motion:reduce){.pulse .num{animation:none}.bar i,.clock .prg{transition:none}}
</style>
</head>
<body>

<div class="app">
  <!-- START -->
  <section class="view" id="vStart">
    <div>
      <span class="label">Sessione</span>
      <h1>Stretching serale</h1>
    </div>
    <p class="sub">30 secondi di tenuta, 15 di riposo. Figure four e Hip flexor si fanno su entrambe le gambe. Durante il riposo vedi già il prossimo esercizio.</p>
    <ul class="plan" id="plan"></ul>
    <div class="meta">
      <span class="label" id="totLabel"></span>
      <span class="label">5 s per prepararti</span>
    </div>
    <div class="toggles">
      <button class="chip" id="tSound" aria-pressed="true">Suoni</button>
      <button class="chip" id="tVoice" aria-pressed="true">Voce</button>
    </div>
    <button class="primary" id="btnStart" style="margin-top:auto">Via</button>
  </section>

  <!-- RUN -->
  <section class="view" id="vRun" hidden>
    <div class="top">
      <span class="phase" id="phase">Preparati</span>
      <span class="label" id="count">1 / 7</span>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="stage">
      <span class="side" id="side" hidden>SX</span>
      <span class="label" id="nextLbl" hidden>Prossimo</span>
      <div id="figWrap"></div>
      <div class="ex-name" id="exName"></div>
      <div class="ex-muscle" id="exMuscle"></div>
    </div>
    <div class="clock" id="clock">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="trk" cx="100" cy="100" r="90" fill="none" stroke-width="10"/>
        <circle class="prg" id="ring" cx="100" cy="100" r="90" fill="none" stroke-width="10" stroke-linecap="round"/>
      </svg>
      <div class="num" id="num">30</div>
    </div>
    <div class="controls">
      <button class="ghost" id="btnStop">Stop</button>
      <button class="primary" id="btnPause">Pausa</button>
      <button class="ghost" id="btnSkip">Salta</button>
    </div>
  </section>

  <!-- DONE -->
  <section class="view done" id="vDone" hidden>
    <span class="label">Sessione completata</span>
    <div class="big">Fatto.</div>
    <p class="sub" id="doneTxt"></p>
    <button class="primary" id="btnAgain" style="max-width:320px">Ricomincia</button>
  </section>
</div>

<script>
const WORK = 30, REST = 15, PREP = 5;

/* Stick figures, viewBox 200x140, floor at y=122 */
const FIG = {
  pancake: `
    <line class="gd" x1="14" y1="124" x2="186" y2="124"/>
    <ellipse class="zone" cx="100" cy="116" rx="46" ry="10"/>
    <path class="ln" d="M100 116 L28 120 M100 116 L172 120"/>
    <path class="ln" d="M100 116 Q100 104 102 96"/>
    <path class="ln" d="M101 98 L76 116 M101 98 L126 116"/>
    <circle class="hd" cx="102" cy="85" r="10"/>`,
  figure4: `
    <line class="gd" x1="14" y1="124" x2="186" y2="124"/>
    <circle class="zone" cx="104" cy="106" r="17"/>
    <circle class="hd" cx="34" cy="111" r="10"/>
    <path class="ln" d="M48 115 L100 115"/>
    <path class="ln" d="M100 115 L124 80 L156 98"/>
    <path class="ln" d="M100 115 L134 104 L122 84"/>
    <path class="ln" d="M56 112 L116 92"/>`,
  hipflex: `
    <line class="gd" x1="14" y1="124" x2="186" y2="124"/>
    <ellipse class="zone" cx="92" cy="98" rx="13" ry="18" transform="rotate(-20 92 98)"/>
    <path class="ln" d="M100 84 L142 86 L144 120 L158 120"/>
    <path class="ln" d="M100 84 L80 120 L40 120"/>
    <path class="ln" d="M100 84 L98 46"/>
    <path class="ln" d="M98 50 L92 16"/>
    <circle class="hd" cx="98" cy="34" r="10"/>`,
  chest: `
    <line class="gd" x1="14" y1="124" x2="186" y2="124"/>
    <ellipse class="zone" cx="110" cy="52" rx="12" ry="14"/>
    <path class="ln" d="M100 78 L96 120 L106 120 M100 78 L104 120"/>
    <path class="ln" d="M100 78 Q104 60 104 42"/>
    <path class="ln" d="M102 46 L82 66 L76 86"/>
    <circle class="hd" cx="108" cy="28" r="10"/>`,
  lat: `
    <line class="gd" x1="14" y1="124" x2="186" y2="124"/>
    <ellipse class="zone" cx="92" cy="62" rx="10" ry="20" transform="rotate(25 92 62)"/>
    <path class="ln" d="M100 80 L86 120 M100 80 L114 120"/>
    <path class="ln" d="M100 80 Q98 58 112 42"/>
    <path class="ln" d="M110 44 Q120 18 146 20 M110 44 Q132 30 150 34"/>
    <circle class="hd" cx="124" cy="46" r="10"/>`
};

const EX = [
  {key:'pancake', name:'Pancake', muscle:'Adduttori e femorali'},
  {key:'figure4', name:'Figure four', muscle:'Gluteo e piriforme', sides:true},
  {key:'hipflex', name:'Hip flexor', muscle:'Flessori dell’anca e psoas', sides:true},
  {key:'chest', name:'Chest opening', muscle:'Pettorali e spalle'},
  {key:'lat', name:'Lat stretch', muscle:'Gran dorsale e fianchi'}
];

/* Build the timeline: prep, then work/rest alternating, no rest after the last hold */
const holds = [];
EX.forEach(e => e.sides ? holds.push({...e, side:'sx'}, {...e, side:'dx'}) : holds.push({...e}));
const steps = [{type:'prep', dur:PREP, ex:holds[0]}];
holds.forEach((h,i) => {
  steps.push({type:'work', dur:WORK, ex:h, n:i+1});
  if (i < holds.length-1) steps.push({type:'rest', dur:REST, ex:holds[i+1]});
});
const TOTAL = steps.reduce((a,s)=>a+s.dur,0);

const $ = id => document.getElementById(id);
const sideTxt = s => s==='sx' ? 'gamba sinistra' : 'gamba destra';
function figSVG(key, mirror, cls='fig'){
  const g = mirror ? `<g transform="translate(200 0) scale(-1 1)">${FIG[key]}</g>` : FIG[key];
  return `<svg class="${cls}" viewBox="0 0 200 140" role="img" aria-hidden="true">${g}</svg>`;
}
const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;

/* Start list */
$('plan').innerHTML = EX.map(e => `
  <li>${figSVG(e.key,false)}
    <div><div class="n">${e.name}</div><div class="m">${e.sides ? 'Sinistra, poi destra' : e.muscle}</div></div>
    <span class="t">${e.sides ? '2 × 30 s' : '30 s'}</span></li>`).join('');
$('totLabel').textContent = `${holds.length} tenute · ${fmt(TOTAL)} min in tutto`;

/* Settings */
const store = {get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v==='1'}catch(e){return d}},
               set(k,v){try{localStorage.setItem(k,v?'1':'0')}catch(e){}}};
let soundOn = store.get('st-sound',true), voiceOn = store.get('st-voice',true);
function syncToggles(){ $('tSound').setAttribute('aria-pressed',soundOn); $('tVoice').setAttribute('aria-pressed',voiceOn); }
$('tSound').onclick = ()=>{ soundOn=!soundOn; store.set('st-sound',soundOn); syncToggles(); };
$('tVoice').onclick = ()=>{ voiceOn=!voiceOn; store.set('st-voice',voiceOn); syncToggles(); };
syncToggles();

/* Audio */
let ac = null;
function beep(freq=880, dur=.12, vol=.25){
  if (!soundOn || !ac) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type='sine'; o.frequency.value=freq;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+.02);
}
function say(txt){
  if (!voiceOn || !('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(txt); u.lang='it-IT'; u.rate=1.02; speechSynthesis.speak(u);}catch(e){}
}
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p) }catch(e){} }

/* Wake lock */
let lock = null;
async function keepAwake(){ try{ lock = await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible' && running && !paused) keepAwake(); });

/* Engine */
const C = 2*Math.PI*90; $('ring').style.strokeDasharray = C;
let idx=0, endAt=0, remainMs=0, running=false, paused=false, lastSec=-1, timer=null, startedAt=0;

function show(v){ ['vStart','vRun','vDone'].forEach(x=>$(x).hidden = x!==v); }

function enter(i){
  idx=i; const s=steps[i]; lastSec=-1;
  endAt = performance.now() + s.dur*1000;
  document.body.dataset.phase = s.type;
  $('phase').textContent = s.type==='work' ? 'Tieni' : s.type==='rest' ? 'Riposo' : 'Preparati';
  $('nextLbl').hidden = s.type==='work';
  $('nextLbl').textContent = s.type==='prep' ? 'Si parte con' : 'Prossimo';
  const ex = s.ex;
  $('figWrap').innerHTML = figSVG(ex.key, ex.side==='dx');
  $('exName').textContent = ex.name;
  $('exMuscle').textContent = ex.side ? `${sideTxt(ex.side)[0].toUpperCase()+sideTxt(ex.side).slice(1)} · ${ex.muscle}` : ex.muscle;
  $('side').hidden = !ex.side; $('side').textContent = (ex.side||'').toUpperCase();
  const n = s.type==='work' ? s.n : (s.type==='prep' ? 1 : steps[i+1].n);
  $('count').textContent = `${n} / ${holds.length}`;

  const label = ex.name + (ex.side ? ', ' + sideTxt(ex.side) : '');
  if (s.type==='work'){ beep(1046,.45,.3); buzz(300); say('Via. ' + label); }
  else if (s.type==='rest'){ beep(523,.45,.3); buzz([120,80,120]); say('Riposo. Prossimo: ' + label); }
  else say('Preparati. Si parte con ' + label);
  render();
}

function render(){
  const s = steps[idx];
  const left = Math.max(0, (paused ? remainMs : endAt - performance.now()));
  const sec = Math.ceil(left/1000);
  if (sec !== lastSec){
    $('num').textContent = sec;
    if (sec<=3 && sec>0 && lastSec!==-1){ beep(784,.1,.25); const c=$('clock'); c.classList.remove('pulse'); void c.offsetWidth; c.classList.add('pulse'); }
    lastSec = sec;
  }
  $('ring').style.strokeDashoffset = C * (1 - left/(s.dur*1000));
  const before = steps.slice(0,idx).reduce((a,x)=>a+x.dur,0);
  $('bar').style.width = ((before + s.dur - left/1000)/TOTAL*100) + '%';
  if (!paused && left<=0) next();
}

function next(){
  if (idx < steps.length-1) enter(idx+1); else finish();
}

function loop(){ if (running && !paused) render(); }

function start(){
  try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); ac.resume(); }catch(e){}
  running=true; paused=false; startedAt=Date.now();
  $('btnPause').textContent='Pausa';
  show('vRun'); keepAwake(); enter(0);
  clearInterval(timer); timer = setInterval(loop, 100);
}

function finish(){
  running=false; clearInterval(timer);
  document.body.dataset.phase='work';
  beep(784,.15); setTimeout(()=>beep(988,.15),170); setTimeout(()=>beep(1318,.5),340);
  buzz([200,100,200,100,400]); say('Fatto. Ottimo lavoro.');
  const mins = Math.round((Date.now()-startedAt)/1000);
  $('doneTxt').textContent = `${holds.length} tenute completate in ${fmt(mins)} minuti. Bevi un po' d'acqua.`;
  try{ lock && lock.release(); }catch(e){}
  show('vDone');
}

function stop(){
  running=false; paused=false; clearInterval(timer);
  try{ speechSynthesis.cancel(); }catch(e){}
  try{ lock && lock.release(); }catch(e){}
  document.body.dataset.phase='work'; show('vStart');
}

$('btnStart').onclick = start;
$('btnAgain').onclick = start;
$('btnStop').onclick = stop;
$('btnSkip').onclick = ()=>{ if (paused){ paused=false; $('btnPause').textContent='Pausa'; } next(); };
$('btnPause').onclick = ()=>{
  if (!paused){ remainMs = Math.max(0,endAt-performance.now()); paused=true; $('btnPause').textContent='Riprendi'; try{speechSynthesis.cancel()}catch(e){} }
  else { endAt = performance.now()+remainMs; paused=false; $('btnPause').textContent='Pausa'; }
  render();
};
document.body.dataset.phase='work';
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}</script>
</body>
</html>
